name: Temporary catalog reconnaissance

on:
  push:
    branches: [arena/e6074aa1-streamflix2]
    paths:
      - .github/workflows/recon.yml
      - scripts/catalog-recon.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e6074aa1-streamflix2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect equivalent public player pages and first-party scripts
        run: node scripts/catalog-recon.cjs > recon-shared.txt 2>&1
      - name: Return diagnostics to the working branch
        if: always()
        run: |
          cat recon-shared.txt || true
          git config user.name "arena-recon[bot]"
          git config user.email "arena-recon[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
            exit 0
          fi
          git commit -m "Collect temporary shared-player diagnostics [skip ci]"
          git push origin arena/e6074aa1-streamflix2

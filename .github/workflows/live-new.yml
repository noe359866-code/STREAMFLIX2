name: Temporary new-provider live validation

on:
  push:
    branches: [arena/e6074aa1-streamflix2]
    paths: [.github/workflows/live-new.yml]

jobs:
  live:
    name: Live new providers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ejecutar sondas y conservar resultados operativos
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set +e
          : > live-summary.txt
          if [[ -z "${TMDB_API_KEY:-}" ]]; then
            echo 'TMDB_API_KEY=missing; live checks not run' >> live-summary.txt
            exit 0
          fi
          echo 'TMDB_API_KEY=present' >> live-summary.txt
          specs=(
            'danimados|111111|tv|2|3'
            'pelisgo|tt26581740|movie|1|1'
            'hdfull|tt26581740|movie|1|1'
          )
          for spec in "${specs[@]}"; do
            IFS='|' read -r provider tmdb type season episode <<< "$spec"
            node scripts/live-check.cjs --provider "$provider" --tmdb "$tmdb" --type "$type" --season "$season" --episode "$episode" --playback --output "live-$provider.json" > "live-$provider.log" 2>&1
            code=$?
            echo "$provider exit=$code" >> live-summary.txt
            sed -i -E 's/(api_key=)[^ &\"]+/\1REDACTED/g' "live-$provider.log"
          done
          exit 0
      - name: Guardar informes temporales en la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Report new provider live checks [skip ci]'
          git push origin HEAD:arena/e6074aa1-streamflix2

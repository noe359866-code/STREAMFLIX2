name: Validate Nuvio plugins

on:
  push:
    branches: [main, "feature/**", "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: "Proveedor para la prueba real"
        required: true
        default: cinehax
        type: string
      tmdb:
        description: "ID TMDB para la prueba real"
        required: true
        default: "550"
        type: string
      media_type:
        description: "Tipo de contenido"
        required: true
        default: movie
        type: choice
        options: [movie, tv]
      season:
        description: "Temporada para TV"
        required: true
        default: "1"
        type: string
      episode:
        description: "Episodio para TV"
        required: true
        default: "1"
        type: string
      playback:
        description: "Descargar los primeros bytes del medio"
        required: true
        default: true
        type: boolean

jobs:
  probe_beamup:
    name: Diagnosticar Beamup en vivo
    if: github.ref_name == 'arena/c7a4bba8-streamflix2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probar Beamup desplegado, Cinemeta y proveedores
        run: |
          node - <<'EOF'
          const { encodeConfig, ACTIVE_SCRAPERS } = require('./stremio/config.cjs');
          const { resolveStremioMetadata, parseStremioId } = require('./stremio/metadata.cjs');

          const BEAMUP = 'https://7e2a912be9c9-streamflix2.baby-beamup.club';

          function emit(title, obj) {
            const msg = JSON.stringify(obj).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            console.log(`::notice title=${title}::${msg}`);
          }

          async function timedFetch(url, timeoutMs = 40000, headers = {}) {
            const t0 = Date.now();
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
              const res = await fetch(url, { signal: ctrl.signal, headers });
              const text = await res.text();
              let json = null;
              try { json = JSON.parse(text); } catch (_) {}
              return {
                ok: res.ok,
                status: res.status,
                ms: Date.now() - t0,
                cache: res.headers.get('x-cache-status') || res.headers.get('cf-cache-status') || '',
                cors: res.headers.get('access-control-allow-origin') || '',
                streamsCount: Array.isArray(json?.streams) ? json.streams.length : null,
                sample: Array.isArray(json?.streams) ? json.streams.slice(0, 2) : (json || text.slice(0, 300)),
              };
            } catch (err) {
              return { ok: false, error: err.message, ms: Date.now() - t0 };
            } finally {
              clearTimeout(timer);
            }
          }

          (async () => {
            // 1. Probar endpoints en vivo de Beamup (sin URLs largas para no truncar)
            const cinehaxSeg = encodeConfig({ providers: ['cinehax'] });
            const beamupChecks = {};
            for (const [k, path] of [
              ['cinehaxFightClub', `/${cinehaxSeg}/stream/movie/tt0137523.json`],
              ['allFightClub', '/stream/movie/tt0137523.json'],
              ['allInsideOut2', '/stream/movie/tt22022452.json'],
              ['allDeadpool3', '/stream/movie/tt6263850.json'],
              ['allBreakingBadColon', '/stream/series/tt0903747:1:1.json'],
              ['allBreakingBadPct', '/stream/series/tt0903747%3A1%3A1.json'],
              ['allOnePiecePct', '/stream/series/tt0388629%3A1%3A1.json'],
            ]) {
              const r = await timedFetch(`${BEAMUP}${path}`, 45000);
              beamupChecks[k] = { ok: r.ok, status: r.status, ms: r.ms, cache: r.cache, count: r.streamsCount, err: r.error, firstName: r.sample?.[0]?.title };
            }
            emit('BEAMUP_SUMMARY', beamupChecks);

            // 2. Probar IMDb GraphQL + TMDB web pública sin API key para obtener títulos en español (MX/ES)
            const esTests = {};
            for (const [imdbId, tmdbId, type] of [['tt22022452', '1022789', 'movie'], ['tt0137523', '550', 'movie'], ['tt6263850', '533535', 'movie'], ['tt0903747', '1396', 'tv']]) {
              const gqlQuery = {
                query: `query($id: ID!) { title(id: $id) { titleText { text } originalTitleText { text } releaseYear { year } akas(first: 30) { edges { node { text country { id } language { id } } } } } }`,
                variables: { id: imdbId },
              };
              const gql = await fetch('https://api.graphql.imdb.com/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept-Language': 'es-MX,es;q=0.9', 'User-Agent': 'Mozilla/5.0' },
                body: JSON.stringify(gqlQuery),
              }).then((x) => x.json()).catch((e) => ({ err: e.message }));
              const akas = (gql?.data?.title?.akas?.edges || [])
                .map((e) => ({ t: e?.node?.text, c: e?.node?.country?.id, l: e?.node?.language?.id }))
                .filter((a) => !a.c || ['MX', 'ES', 'AR', 'CO', 'CL', 'PE', 'VE', 'US', 'XWW', 'XYU'].includes(a.c));

              const tmdbWeb = await fetch(`https://www.themoviedb.org/${type}/${tmdbId}?language=es-MX`, {
                headers: { 'Accept-Language': 'es-MX,es;q=0.9', 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0.0.0' },
              }).then(async (x) => {
                const txt = await x.text();
                const og = txt.match(/<meta\s+property=["']og:title["']\s+content=["']([^"']+)["']/i)?.[1]
                  || txt.match(/<title>([^<]+)<\/title>/i)?.[1];
                return { status: x.status, og };
              }).catch((e) => ({ err: e.message }));

              esTests[imdbId] = {
                gqlTitle: gql?.data?.title?.titleText?.text,
                gqlOrig: gql?.data?.title?.originalTitleText?.text,
                akas: akas.slice(0, 8),
                tmdbWeb,
              };
            }
            emit('ES_TITLE_SOURCES', esTests);

            // 3. Diagnosticar por qué fallaron proveedores específicos (CineHax en 1022789, TV, Anime)
            const chCheck = {};
            for (const p of ['/e/movie/550', '/e/movie/1022789', '/e/movie/533535', '/e/tv/1396/1/1']) {
              try {
                const r = await fetch('https://api.moviemaster.lat' + p, {
                  headers: { Referer: 'https://api.moviemaster.lat/', 'User-Agent': 'Mozilla/5.0 Chrome/124.0.0.0', 'Sec-Fetch-Dest': 'iframe', 'Sec-Fetch-Mode': 'navigate' },
                });
                const txt = await r.text();
                const ui = txt.match(/window\.PM_UI\s*=\s*["']([^"']+)["']/i)?.[1];
                let serversCount = -1;
                let sampleSrv = null;
                if (ui) {
                  const id = p.split('/')[3];
                  const isTv = p.includes('/tv/');
                  const q = isTv ? `tmdb=${id}&type=tv&season=1&episode=1&ui=${encodeURIComponent(ui)}` : `tmdb=${id}&type=movie&ui=${encodeURIComponent(ui)}`;
                  const sr = await fetch(`https://api.moviemaster.lat/servers?${q}`, { headers: { Referer: 'https://api.moviemaster.lat/', 'User-Agent': 'Mozilla/5.0 Chrome/124.0.0.0' } });
                  const sj = await sr.json();
                  serversCount = (sj.servers || []).length;
                  if (sj.servers?.[0]) {
                    const vr = await fetch(`https://api.moviemaster.lat/video?${q.replace(/&ui=.*/, '')}&embed=${encodeURIComponent(sj.servers[0].id)}&noiframe=1&r=1`, { headers: { Referer: 'https://api.moviemaster.lat/', 'User-Agent': 'Mozilla/5.0 Chrome/124.0.0.0' } });
                    sampleSrv = await vr.json().catch(() => ({ status: vr.status }));
                  }
                }
                chCheck[p] = { status: r.status, hasUi: Boolean(ui), serversCount, sampleSrv };
              } catch (e) {
                chCheck[p] = { err: e.message };
              }
            }
            emit('CINEHAX_DIAG', chCheck);

            // 4. Probar proveedores de TV y Anime en vivo (Breaking Bad S01E01 + Jujutsu Kaisen S01E01)
            const { runWithRequestContext } = require('./stremio/metadata.cjs');
            const tvStats = {};
            const bbMeta = {
              id: '1396', tmdbId: '1396', imdbId: 'tt0903747',
              title: 'Breaking Bad', originalTitle: 'Breaking Bad', titles: ['Breaking Bad'], year: '2008', mediaType: 'tv',
            };
            await runWithRequestContext({ tmdbApiKey: '', metadata: bbMeta }, async () => {
              await Promise.all(ACTIVE_SCRAPERS.filter((s) => s.supportedTypes.includes('tv')).map(async (s) => {
                const t0 = Date.now();
                try {
                  const mod = require(`./providers/${s.id}.js`);
                  const res = await Promise.race([
                    mod.getStreams('tmdb:1396', 'tv', 1, 1),
                    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout-12s')), 12000)),
                  ]);
                  tvStats[s.id] = { count: Array.isArray(res) ? res.length : -1, ms: Date.now() - t0 };
                } catch (e) {
                  tvStats[s.id] = { err: e.message, ms: Date.now() - t0 };
                }
              }));
            });
            emit('PROVIDER_TV_STATS', tvStats);
          })();
          EOF

  validate:
    name: Build y pruebas offline (Nuvio + Stremio Beamup)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Compilar y ejecutar todas las pruebas
        run: npm run check
      - name: Validar sintaxis de herramientas
        run: |
          node --check server.cjs
          node --check stremio/server.cjs
          node --check scripts/live-check.cjs
          bash -n scripts/deploy-beamup.sh
      - name: Comprobar servidor local Nuvio
        run: |
          PORT=3001 npm run start:nuvio > /tmp/streamflix2-nuvio.log 2>&1 &
          NUVIO_PID=$!
          trap 'kill "$NUVIO_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/manifest.json -o /tmp/nuvio-manifest.json; then break; fi
            sleep 1
          done
          cmp manifest.json /tmp/nuvio-manifest.json
          curl -fsS http://127.0.0.1:3001/providers/animeav1.js -o /tmp/animeav1.js
          grep -q getStreams /tmp/animeav1.js
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/package.json)" = 404
      - name: Comprobar Addon Stremio y stremio-addon-linter (check-deploy de Beamup)
        run: |
          PORT=7001 npm start > /tmp/streamflix2-stremio.log 2>&1 &
          STREMIO_PID=$!
          trap 'kill "$STREMIO_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:7001/manifest.json -o /tmp/stremio-manifest.json; then break; fi
            sleep 1
          done
          node -e '
            const fs = require("node:fs");
            const { lintManifest } = require("stremio-addon-linter");
            const res = lintManifest(JSON.parse(fs.readFileSync("/tmp/stremio-manifest.json", "utf8")));
            if (!res.valid) { console.error(res.errors); process.exit(1); }
          '
          curl -fsS http://127.0.0.1:7001/configure | grep -q "STREAMFLIX2"
          curl -fsS http://127.0.0.1:7001/nuvio/manifest.json -o /tmp/stremio-nuvio-manifest.json
          cmp manifest.json /tmp/stremio-nuvio-manifest.json
      - name: Publicar paquete instalable Nuvio
        uses: actions/upload-artifact@v4
        with:
          name: streamflix2-nuvio-providers
          path: |
            manifest.json
            providers/
          if-no-files-found: error

  live:
    name: Prueba real desde GitHub Actions
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Descubrir y comprobar streams reales
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PROVIDER: ${{ inputs.provider || 'cinehax' }}
          TMDB_ID: ${{ inputs.tmdb || '550' }}
          MEDIA_TYPE: ${{ inputs.media_type || 'movie' }}
          SEASON: ${{ inputs.season || '1' }}
          EPISODE: ${{ inputs.episode || '1' }}
          PLAYBACK: ${{ github.event_name == 'push' && 'true' || inputs.playback }}
        run: |
          args=(--provider "$PROVIDER" --tmdb "$TMDB_ID" --type "$MEDIA_TYPE" --season "$SEASON" --episode "$EPISODE" --output live-result.json)
          if [[ "$PLAYBACK" == "true" ]]; then args+=(--playback); fi
          node scripts/live-check.cjs "${args[@]}"
      - name: Probar extremo a extremo el Addon Stremio (Cinemeta tt0137523 -> CineHax)
        if: (inputs.provider || 'cinehax') == 'cinehax'
        run: |
          PORT=7009 npm start > /tmp/stremio-live.log 2>&1 &
          ADDON_PID=$!
          trap 'kill "$ADDON_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:7009/health >/dev/null; then break; fi
            sleep 1
          done
          SEG="$(node -e 'const { encodeConfig } = require("./stremio/config.cjs"); console.log(encodeConfig({ providers: ["cinehax"] }));')"
          curl -fsS "http://127.0.0.1:7009/${SEG}/stream/movie/tt0137523.json" -o /tmp/stremio-live-streams.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("/tmp/stremio-live-streams.json", "utf8"));
            if (!Array.isArray(data.streams) || data.streams.length < 1) {
              console.error("Se esperaba al menos 1 stream para tt0137523:", data);
              process.exit(1);
            }
            console.log(`✓ Stremio live tt0137523 devolvió ${data.streams.length} streams con proxyHeaders`);
          '
      - name: Publicar informe de la prueba real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ inputs.provider || 'cinehax' }}-${{ inputs.tmdb || '550' }}
          path: live-result.json
          if-no-files-found: warn

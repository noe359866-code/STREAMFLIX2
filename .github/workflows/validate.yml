name: Validate Nuvio plugins

on:
  push:
    branches: [main, "feature/**", "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: "Proveedor para la prueba real"
        required: true
        default: cinehax
        type: string
      tmdb:
        description: "ID TMDB para la prueba real"
        required: true
        default: "550"
        type: string
      media_type:
        description: "Tipo de contenido"
        required: true
        default: movie
        type: choice
        options: [movie, tv]
      season:
        description: "Temporada para TV"
        required: true
        default: "1"
        type: string
      episode:
        description: "Episodio para TV"
        required: true
        default: "1"
        type: string
      playback:
        description: "Descargar los primeros bytes del medio"
        required: true
        default: true
        type: boolean

jobs:
  validate:
    name: Build y pruebas E2E (Nuvio + Stremio + Nginx real)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Compilar y ejecutar todas las pruebas unitarias e integración
        run: npm run check
      - name: Validar sintaxis de herramientas y plantillas
        run: |
          node --check server.cjs
          node --check stremio/server.cjs
          node --check nginx/render-config.cjs
          node --check scripts/verify-nginx-e2e.cjs
          node --check scripts/live-check.cjs
          bash -n scripts/deploy-beamup.sh
          bash -n nginx/install-nginx.sh
          npm run nginx:render -- --check
      - name: Comprobar servidor local Nuvio
        run: |
          PORT=3001 npm run start:nuvio > /tmp/streamflix2-nuvio.log 2>&1 &
          NUVIO_PID=$!
          trap 'kill "$NUVIO_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/manifest.json -o /tmp/nuvio-manifest.json; then break; fi
            sleep 1
          done
          cmp manifest.json /tmp/nuvio-manifest.json
          curl -fsS http://127.0.0.1:3001/providers/animeav1.js -o /tmp/animeav1.js
          grep -q getStreams /tmp/animeav1.js
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/package.json)" = 404
      - name: Prueba E2E real con Nginx (caché, HLS sub_filter, Range 206, token y SSRF)
        run: |
          echo "127.0.0.1 cdn.streamflix2.test" | sudo tee -a /etc/hosts
          sudo apt-get update -y && sudo apt-get install -y nginx-full
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo NGINX_PORT=8088 \
            SERVER_NAME=_ \
            BEAMUP_SCHEME=http \
            BEAMUP_HOST=127.0.0.1:7001 \
            NGINX_PROXY_TOKEN=ci_tok_2026 \
            DNS_RESOLVER=127.0.0.53 \
            bash nginx/install-nginx.sh
          ADDON_PORT=7001 CDN_PORT=8080 NGINX_URL=http://127.0.0.1:8088 NGINX_PROXY_TOKEN=ci_tok_2026 npm run nginx:e2e
      - name: Publicar paquete instalable Nuvio
        uses: actions/upload-artifact@v4
        with:
          name: streamflix2-nuvio-providers
          path: |
            manifest.json
            providers/
          if-no-files-found: error
      - name: Publicar paquete Nginx externo listo para servidor
        uses: actions/upload-artifact@v4
        with:
          name: streamflix2-external-nginx
          path: |
            nginx/
          if-no-files-found: error

  live:
    name: Prueba real desde GitHub Actions
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Descubrir y comprobar streams reales
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PROVIDER: ${{ inputs.provider || 'cinehax' }}
          TMDB_ID: ${{ inputs.tmdb || '550' }}
          MEDIA_TYPE: ${{ inputs.media_type || 'movie' }}
          SEASON: ${{ inputs.season || '1' }}
          EPISODE: ${{ inputs.episode || '1' }}
          PLAYBACK: ${{ github.event_name == 'push' && 'true' || inputs.playback }}
        run: |
          args=(--provider "$PROVIDER" --tmdb "$TMDB_ID" --type "$MEDIA_TYPE" --season "$SEASON" --episode "$EPISODE" --output live-result.json)
          if [[ "$PLAYBACK" == "true" ]]; then args+=(--playback); fi
          node scripts/live-check.cjs "${args[@]}"
      - name: Publicar informe de la prueba real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ inputs.provider || 'cinehax' }}-${{ inputs.tmdb || '550' }}
          path: live-result.json
          if-no-files-found: warn

name: Validate Nuvio plugins

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run test:syntax
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: streamflix2-nuvio-dist
          path: dist/

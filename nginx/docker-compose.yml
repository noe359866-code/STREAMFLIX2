services:
  streamflix2-nginx:
    image: nginx:1.27-alpine
    container_name: streamflix2-nginx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NGINX_PORT: ${NGINX_PORT:-8080}
      SERVER_NAME: ${SERVER_NAME:-_}
      BEAMUP_SCHEME: ${BEAMUP_SCHEME:-https}
      BEAMUP_HOST: ${BEAMUP_HOST:?Define BEAMUP_HOST en nginx/.env}
      NGINX_PROXY_TOKEN: ${NGINX_PROXY_TOKEN:-}
      DNS_RESOLVER: ${DNS_RESOLVER:-1.1.1.1 8.8.8.8}
      NGINX_ENVSUBST_FILTER: "^(NGINX_PORT|SERVER_NAME|BEAMUP_SCHEME|BEAMUP_HOST|NGINX_PROXY_TOKEN|DNS_RESOLVER)$"
    ports:
      - "${NGINX_PORT:-8080}:${NGINX_PORT:-8080}"
    volumes:
      - ./streamflix2.conf.template:/etc/nginx/templates/streamflix2.conf.template:ro
      - streamflix2_nginx_cache:/var/cache/nginx/streamflix2_addon
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${NGINX_PORT:-8080}/nginx-health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  streamflix2_nginx_cache:
